services:
  postgres:
    image: postgres:16-alpine
    container_name: brightloop_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brightloop_subscriptions
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brightloop_subscriptions"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: brightloop_mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI for password reset emails
    environment:
      MP_MAX_MESSAGES: 500

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brightloop_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/brightloop_subscriptions?schema=public
      JWT_SECRET: brightloop_production_grade_jwt_secret_kochi_hackathon_2026_odoo
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:5173
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: "Brightloop Software <billing@brightloop.io>"
    command: >
      sh -c "npx prisma db push &&
             npx tsx prisma/seed.ts &&
             node dist/index.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brightloop_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
